services:
  - type: web
    name: alashop-backend
    runtime: docker
    rootDir: alashop-backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: alashop-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://alashop-frontend-git-main-alashop.vercel.app

databases:
  - name: alashop-db
    databaseName: alashop_db
    user: alashop_db_user
    plan: free
    region: oregon
