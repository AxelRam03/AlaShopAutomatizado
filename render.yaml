services:
  - type: web
    name: alashop-backend
    runtime: python
    rootDir: alashop-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        value: AlaShop2024SecretKey123456789012
      - key: FRONTEND_URL
        value: https://alashop-frontend-git-main-alashop.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        value: placeholder
      - key: CLOUDINARY_API_KEY
        value: placeholder
      - key: CLOUDINARY_API_SECRET
        value: placeholder
      - key: MP_ACCESS_TOKEN
        value: placeholder
      - key: MP_PUBLIC_KEY
        value: placeholder
      - key: WEBHOOK_SECRET
        value: placeholder
      - key: STRIPE_SECRET_KEY
        value: placeholder
      - key: STRIPE_WEBHOOK_SECRET
        value: placeholder
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: placeholder@gmail.com
      - key: SMTP_PASSWORD
        value: placeholder
      - key: EMAILS_FROM_EMAIL
        value: noreply@alashop.mx
  - type: pserv
    name: alashop-db
    runtime: pgsql
    plan: free
